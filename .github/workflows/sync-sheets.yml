name: 🔄 Sync Google Sheets → index.html

on:
  schedule:
    # Chạy mỗi ngày lúc 8:00 sáng giờ Việt Nam (01:00 UTC)
    # Muốn chạy mỗi giờ → đổi thành: '0 * * * *'
    # Muốn mỗi 30 phút   → đổi thành: '*/30 * * * *'
    - cron: '0 1 * * *'

  workflow_dispatch:   # Cho phép bấm nút chạy thủ công trên GitHub

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Cần quyền này để commit & push

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ▶️ Chạy script sync
        env:
          SHEET_ID:  ${{ secrets.SHEET_ID }}
          SHEET_GID: ${{ secrets.SHEET_GID }}
        run: python scripts/sync_sheets.py

      - name: 📤 Commit & push nếu có thay đổi
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "✅ Không có thay đổi, bỏ qua commit."
          else
            UPDATED=$(TZ='Asia/Ho_Chi_Minh' date '+%d/%m/%Y %H:%M')
            git commit -m "🔄 Sync bảng giá từ Google Sheets [$UPDATED]"
            git push
            echo "✅ Đã push cập nhật lên GitHub."
          fi
