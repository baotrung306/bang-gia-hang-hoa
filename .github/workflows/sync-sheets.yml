name: Sync Google Sheets to index.html

on:
  schedule:
    - cron: '*/30 * * * *'  # Mỗi 30 phút 1 lần
  workflow_dispatch:      # Cho phép chạy thủ công

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Chay script sync
        env:
          SHEET_ID:  ${{ secrets.SHEET_ID }}
          SHEET_GID: ${{ secrets.SHEET_GID }}
        run: python scripts/sync_sheets.py

      - name: Commit va push neu co thay doi
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Khong co thay doi, bo qua commit."
          else
            UPDATED=$(TZ='Asia/Ho_Chi_Minh' date '+%d/%m/%Y %H:%M')
            git commit -m "Sync bang gia tu Google Sheets [$UPDATED]"
            git push
            echo "Da push cap nhat len GitHub."
          fi
