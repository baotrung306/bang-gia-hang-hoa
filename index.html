<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --accent: #e63946; --price: #d9480f; --bg: #f5f5f0; --bg2: #ffffff; --bg3: #eeeee8; --border: #ddddd5; --text: #1a1a1a; --muted: #777770; --dim: #aaaaaa; }
body { font-family: 'Be Vietnam Pro', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--bg3); } ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
#header { background: #fff; border-bottom: 1px solid var(--border); box-shadow: 0 2px 12px rgba(0,0,0,.06); padding: 14px 20px; position: sticky; top: 0; z-index: 30; }
.header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.logo-bar { width: 5px; height: 26px; background: var(--accent); border-radius: 3px; }
.logo h1 { font-size: 18px; font-weight: 800; color: #1a1a1a; }
.logo p { font-size: 11px; color: var(--muted); margin-top: 1px; }
.search-wrap { position: relative; flex: 1; min-width: 180px; }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--dim); pointer-events: none; }
#searchInput { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px 9px 34px; color: var(--text); font-size: 14px; font-family: inherit; outline: none; }
#searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(230,57,70,.1); }
#cartBtn { position: relative; background: var(--accent); border: none; border-radius: 10px; padding: 9px 16px; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 7px; flex-shrink: 0; transition: filter .2s; box-shadow: 0 2px 8px rgba(230,57,70,.3); }
#cartBtn:hover { filter: brightness(1.08); }
#cartBadge { position: absolute; top: -6px; right: -6px; background: #1a1a1a; color: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; font-weight: 800; display: none; align-items: center; justify-content: center; }
#subBar { background: #fff; border-bottom: 1px solid var(--border); padding: 10px 20px; }
#subBar .inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cats { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; flex: 1; }
.cats::-webkit-scrollbar { height: 3px; }
.cat-btn { cursor: pointer; border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--bg2); color: var(--muted); font-family: inherit; transition: all .18s; }
.cat-btn:hover { border-color: var(--accent); color: var(--accent); }
.cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 2px 8px rgba(230,57,70,.2); }
#sortSelect { background: var(--bg2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 12px; font-size: 13px; font-family: inherit; cursor: pointer; outline: none; }
#sortSelect:hover { border-color: var(--accent); }
#main { max-width: 1200px; margin: 0 auto; padding: 16px 20px 40px; }
#resultCount { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 14px; transition: all .2s; display: flex; flex-direction: column; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
.card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(230,57,70,.1); }
.card-cat { font-size: 9px; color: var(--dim); letter-spacing: .5px; text-transform: uppercase; margin-bottom: 4px; }
.card-name { font-weight: 600; font-size: 14px; line-height: 1.4; flex: 1; color: #1a1a1a; }
.card-note { display: inline-block; background: #fff3f0; border: 1px solid #ffd5cc; border-radius: 6px; padding: 2px 8px; font-size: 11px; color: #c0392b; margin-top: 8px; font-weight: 500; }
.card-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.card-price { font-size: 19px; font-weight: 800; color: var(--price); }
.add-btn { cursor: pointer; border: 1px solid rgba(230,57,70,.4); border-radius: 8px; padding: 7px 13px; font-size: 13px; font-weight: 600; font-family: inherit; background: #fff3f0; color: var(--accent); transition: all .18s; }
.add-btn:hover { background: var(--accent); color: #fff; }
.card-updated { font-size: 10px; color: var(--dim); margin-top: 8px; }
#emptyMsg { text-align: center; color: var(--muted); padding: 60px 0; font-size: 15px; }
#overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; backdrop-filter: blur(4px); }
#cartPanel { display: none; position: fixed; right: 0; top: 0; bottom: 0; width: min(400px,100vw); background: #fff; border-left: 1px solid var(--border); box-shadow: -4px 0 24px rgba(0,0,0,.1); z-index: 50; flex-direction: column; animation: slideIn .25s ease; }
@keyframes slideIn { from{transform:translateX(100%)}to{transform:translateX(0)} }
.cart-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.cart-header h2 { font-weight: 800; font-size: 17px; }
#closeCart { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }
#cartItems { flex: 1; overflow-y: auto; padding: 14px 20px; background: var(--bg); }
.cart-empty { text-align: center; color: var(--dim); margin-top: 60px; }
.cart-empty div { font-size: 44px; margin-bottom: 10px; }
.cart-item { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); }
.ci-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.ci-name { font-weight: 600; font-size: 14px; }
.ci-note { display: inline-block; background: #fff3f0; border-radius: 5px; padding: 1px 7px; font-size: 10px; color: #c0392b; margin-top: 3px; font-weight: 500; }
.ci-remove { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 16px; }
.ci-bottom { display: flex; align-items: center; justify-content: space-between; }
.qty-wrap { display: flex; align-items: center; gap: 10px; }
.qty-btn { border: none; border-radius: 6px; width: 28px; height: 28px; font-size: 18px; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; }
.qty-num { font-weight: 700; font-size: 16px; min-width: 22px; text-align: center; }
.ci-price { font-weight: 700; color: var(--price); }
.cart-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
.cart-total { display: flex; justify-content: space-between; margin-bottom: 14px; align-items: center; }
.cart-total span:first-child { color: var(--muted); font-size: 14px; }
.cart-total span:last-child { font-size: 22px; font-weight: 800; color: var(--price); }
#confirmBtn { width: 100%; background: var(--accent); border: none; border-radius: 10px; padding: 13px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; font-family: inherit; margin-bottom: 8px; box-shadow: 0 3px 10px rgba(230,57,70,.3); }
#confirmBtn:hover { filter: brightness(1.08); }
#clearBtn { width: 100%; background: none; border: 1px solid var(--border); border-radius: 10px; padding: 10px; color: var(--muted); font-weight: 500; font-size: 13px; cursor: pointer; font-family: inherit; }
#clearBtn:hover { border-color: var(--accent); color: var(--accent); }
@media (max-width:600px) { .logo h1{font-size:15px} #grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px} .card-price{font-size:16px} }
</style>

const ALL_CATS=["Tất cả","🥤 Nước uống","🥛 Sữa","☕ Cà phê","🍜 Mì & Bún","🍪 Bánh kẹo","🌶️ Gia vị","🚬 Thuốc lá","🕯️ Đồ thờ cúng","🧴 Vệ sinh cá nhân","🧻 Giấy & Vệ sinh","🔧 Đồ dùng khác"];
let activeCategory="Tất cả",cart=[];
function fmt(p){return p.toLocaleString("vi-VN")+"đ"}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
const catList=document.getElementById("catList");
ALL_CATS.forEach(cat=>{
  const btn=document.createElement("button");
  btn.className="cat-btn"+(cat==="Tất cả"?" active":"");
  btn.textContent=cat;
  btn.onclick=()=>{activeCategory=cat;document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render();};
  catList.appendChild(btn);
});
function getFiltered(){
  const q=norm(document.getElementById("searchInput").value.trim());
  const sort=document.getElementById("sortSelect").value;
  let list=products.filter(p=>{
    const mQ=!q||norm(p.name).includes(q)||norm(p.note||"").includes(q);
    const mC=activeCategory==="Tất cả"||p.cat===activeCategory;
    return mQ&&mC;
  });
  if(sort==="asc")list.sort((a,b)=>a.price-b.price);
  else if(sort==="desc")list.sort((a,b)=>b.price-a.price);
  else if(sort==="name")list.sort((a,b)=>a.name.localeCompare(b.name,"vi"));
  return list;
}
function render(){
  const list=getFiltered();
  const grid=document.getElementById("grid");
  const empty=document.getElementById("emptyMsg");
  document.getElementById("resultCount").textContent=list.length?`Hiển thị ${list.length} sản phẩm`:"";
  if(!list.length){grid.innerHTML="";empty.style.display="block";return;}
  empty.style.display="none";
  grid.innerHTML=list.map(p=>`
    <div class="card">
      <div class="card-cat">${p.cat}</div>
      <div class="card-name">${p.name}</div>
      ${p.note?`<span class="card-note">${p.note}</span>`:""}
      <div class="card-bottom">
        <span class="card-price">${fmt(p.price)}</span>
        <button class="add-btn" onclick="addToCart(${p.id},'${(p.note||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'")}')">+ Thêm</button>
      </div>
      ${p.updated?`<div class="card-updated">🕐 ${p.updated}</div>`:""}
    </div>`).join("");
}
function addToCart(id,note){
  const key=id+"-"+note;
  const product=products.find(p=>p.id===id&&(p.note||"")===note);
  if(!product)return;
  const existing=cart.find(c=>c.key===key);
  if(existing)existing.qty++;else cart.push({...product,key,qty:1});
  updateCartUI();
}
function removeFromCart(key){cart=cart.filter(c=>c.key!==key);updateCartUI();}
function changeQty(key,delta){cart=cart.map(c=>c.key===key?{...c,qty:c.qty+delta}:c).filter(c=>c.qty>0);updateCartUI();}
function updateCartUI(){
  const count=cart.reduce((s,c)=>s+c.qty,0);
  const total=cart.reduce((s,c)=>s+c.price*c.qty,0);
  const badge=document.getElementById("cartBadge");
  badge.textContent=count;badge.style.display=count?"flex":"none";
  document.getElementById("cartCount").textContent=count;
  document.getElementById("cartTotal").textContent=fmt(total);
  document.getElementById("cartFooter").style.display=cart.length?"block":"none";
  const items=document.getElementById("cartItems");
  if(!cart.length){items.innerHTML='<div class="cart-empty"><div>🛒</div><p>Giỏ hàng đang trống</p></div>';return;}
  items.innerHTML=cart.map(c=>`
    <div class="cart-item">
      <div class="ci-top">
        <div><div class="ci-name">${c.name}</div>${c.note?`<span class="ci-note">${c.note}</span>`:""}</div>
        <button class="ci-remove" onclick="removeFromCart('${c.key}')">✕</button>
      </div>
      <div class="ci-bottom">
        <div class="qty-wrap">
          <button class="qty-btn" style="background:#eeeee8;color:#1a1a1a" onclick="changeQty('${c.key}',-1)">−</button>
          <span class="qty-num">${c.qty}</span>
          <button class="qty-btn" style="background:#e63946;color:#fff" onclick="changeQty('${c.key}',1)">+</button>
        </div>
        <span class="ci-price">${fmt(c.price*c.qty)}</span>
      </div>
    </div>`).join("");
}
function openCart(){document.getElementById("overlay").style.display="block";document.getElementById("cartPanel").style.display="flex";updateCartUI();}
function closeCart(){document.getElementById("overlay").style.display="none";document.getElementById("cartPanel").style.display="none";}
document.getElementById("cartBtn").onclick=openCart;
document.getElementById("closeCart").onclick=closeCart;
document.getElementById("overlay").onclick=closeCart;
document.getElementById("searchInput").oninput=render;
document.getElementById("sortSelect").onchange=render;
document.getElementById("confirmBtn").onclick=()=>{cart=[];updateCartUI();closeCart();alert("✅ Đã xác nhận đơn hàng!");};
document.getElementById("clearBtn").onclick=()=>{cart=[];updateCartUI();};
render();updateCartUI();
</script>
